name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} · JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # R-T18: Windows is mandatory, not optional. Line endings and default
        # charsets differ materially, and this is a byte-oriented library.
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['21', '25']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` runs, in one command: compilation on the Java 21 baseline, the
      # tests, the JaCoCo floor on core (R-T16), the ArchUnit module rules
      # (R-M5), the descriptor consistency check (R-F1) and the generated-source
      # drift check (R-M8).
      - name: Build
        shell: bash
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/build/reports/jacoco/
          retention-days: 7

  examples:
    name: Examples run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # R-DOC6: an example that does not run is documentation of something that
      # used to work.
      # Through Gradle rather than a shell glob: `build/libs/*` also matches the
      # sources and javadoc jars, and a sources jar carries a copy of every
      # resource that shadows the real one.
      - name: Run the examples
        run: ./gradlew runExamples

  cli-smoke:
    name: The CLI runs as a shipped jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # The unit tests drive the command objects in-process, which is right for
      # covering edge cases and cannot catch the things that only go wrong once
      # the jar is assembled: a missing Main-Class, a resource excluded by the
      # shading rules, a module descriptor left in the uber-jar. This runs the
      # artifact a user would actually download.
      - name: Build the shaded jar
        run: ./gradlew :zengin4j-cli:shadedJar

      - name: Run it end to end
        run: |
          set -uo pipefail
          jar=$(ls zengin4j-cli/build/libs/*-all.jar)
          run() { java -jar "$jar" "$@"; }

          # Asserts an exit status, because the statuses are a contract that
          # scripts branch on (R-CLI1, ADR-0025).
          expect() {
            local want=$1; shift
            "$@" > /dev/null 2>&1
            local got=$?
            if [ "$got" -ne "$want" ]; then
              echo "expected exit $want, got $got: $*" >&2
              exit 1
            fi
          }

          expect 0 run --version
          expect 0 run explain --format=sougou-furikomi
          expect 3 run explain --format=no-such-format
          expect 3 run   # a bare `zengin` asked for nothing

          expect 0 run generate --format=kyuyo-furikomi --count=25 --seed=7 --out=a.txt
          expect 0 run generate --format=kyuyo-furikomi --count=25 --seed=8 --out=b.txt
          expect 0 run inspect a.txt --annotate --allow-unverified

          # The calendar is checked by its stderr line rather than by an exit
          # code. The fixture's value date is the yearless 0930, resolved
          # forward from today, so whether it trips a V-5xx rule depends on what
          # day CI runs — and an assertion that changes answer with the calendar
          # date is a scheduled failure, not a test.
          run validate a.txt --allow-unverified --calendar=bundled 2>&1 >/dev/null \
            | grep -q "bundled Japanese bank calendar" \
            || { echo "--calendar=bundled did not load"; exit 1; }
          expect 0 run validate a.txt --allow-unverified --suppress=V-306

          expect 0 run diff a.txt a.txt --allow-unverified
          expect 1 run diff a.txt b.txt --allow-unverified
          expect 4 run validate nonexistent.txt

          # R-CLI6: an unverified layout must not read without the flag.
          expect 2 run inspect a.txt

          # The same seed must produce the same bytes on this machine too
          # (R-CLI3) — the unit tests prove it in-process, this proves the jar.
          run generate --format=kyuyo-furikomi --count=25 --seed=7 --out=a-again.txt > /dev/null
          cmp a.txt a-again.txt || { echo "generation is not reproducible"; exit 1; }

          # R-CLI4: account numbers must not reach a CI log by default.
          run inspect a.txt --annotate --allow-unverified 2>/dev/null > dump.txt
          grep -q '(masked)' dump.txt || { echo "sensitive fields were not masked"; exit 1; }

  constant-memory:
    name: 1 GB under a 64 MB heap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # R-P2. The constrained heap is the assertion: a 1 GB file is roughly nine
      # million records, and anything on the read path retaining per-record
      # state dies long before the end. Completing is the result. Takes about
      # ten seconds, so it runs on every push rather than nightly.
      - name: Stream a 1 GB file under a constrained heap
        run: ./gradlew :benchmarks:constantMemory

  no-real-identifiers:
    name: No real payment identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # R-L5, P1. This is a payments library; a leaked-looking fixture is a
      # liability even when it is invented.
      - name: Scan for identifiers outside the synthetic ranges
        run: ./.github/scripts/check-no-real-identifiers.sh

  verified-formats-cite-sources:
    name: No verified format without sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # R-0.1, risk R2: the descriptor loader refuses `verified: true` below two
      # cited sources, and this task exercises every bundled descriptor through
      # it. A descriptor claiming verification it has not earned fails here.
      - name: Verify descriptors
        run: ./gradlew :zengin4j-codegen:verifyFormatDescriptors
