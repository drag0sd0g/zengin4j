name: OpenSSF Scorecard

# R-B9. A payments library is a supply-chain target: anyone who compromises it
# reaches every file its users produce. Scorecard grades the things that make
# that harder — branch protection, pinned actions, signed releases, whether
# dangerous workflow triggers are used — and publishes the result, so the answer
# is checkable by someone deciding whether to depend on this.

on:
  branch_protection_rule:
  schedule:
    - cron: '41 5 * * 2'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
      # Needed to publish the results and get a badge.
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing lets the badge resolve and lets a prospective user see the
          # score without running it themselves.
          publish_results: true

      - name: Upload the results as an artefact
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
