name: Release

# The only path to Maven Central. Four gates, because a published coordinate is
# permanent and cannot be withdrawn:
#
#   1. workflow_dispatch — GitHub only offers it to accounts with write access.
#   2. the `maven-central` environment — configure it with required reviewers in
#      Settings → Environments, and every run waits for an explicit approval.
#      The publishing secrets live there, so no other workflow can reach them.
#   3. an actor check — the repository owner, and nobody a collaborator invites.
#   4. a typed confirmation that must match the version being released.
#
# The build itself is the fifth: `-PcentralPublish` is what registers the remote
# repository at all, and nothing sets it outside this file. A developer machine
# has nowhere remote to publish to, whatever Gradle task is run.
#
# R-B7 asks for release automation on tag. Deliberately not done: a tag push is
# a weaker gate than an approval, and the point of this workflow is that
# releasing is a decision somebody makes rather than a side effect of pushing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0 (no leading v)'
        required: true
      confirm:
        description: 'Type the same version again to confirm'
        required: true
      dry_run:
        description: 'Build and sign everything, publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ inputs.version }}
    runs-on: ubuntu-latest

    # Gate 2. Approval, and where the secrets live.
    environment: maven-central

    steps:
      # Gate 3 and 4, before anything is built.
      - name: Check who is releasing, and what
        run: |
          if [ "${{ github.actor }}" != "${{ github.repository_owner }}" ]; then
            echo "::error::${{ github.actor }} is not the repository owner"
            exit 1
          fi
          if [ "${{ inputs.version }}" != "${{ inputs.confirm }}" ]; then
            echo "::error::version and confirmation do not match"
            exit 1
          fi
          if ! printf '%s' "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::'${{ inputs.version }}' is not a semantic version (R-B10)"
            exit 1
          fi
          echo "releasing ${{ inputs.version }} (dry run: ${{ inputs.dry_run }})"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The full gate, on the release artefacts themselves. A release that
      # skipped the checks would be a release nobody had checked.
      - name: Build and verify
        run: ./gradlew build -Pzengin4j.version=${{ inputs.version }} --stacktrace

      - name: Check the CHANGELOG mentions this version
        run: |
          if ! grep -q "${{ inputs.version }}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not mention ${{ inputs.version }} (R-B7)"
            exit 1
          fi

      # R-B4: signed, with sources and javadoc jars. Signing material is an
      # environment secret, so this step cannot run outside the gated job.
      - name: Assemble and sign
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew assemble -Pzengin4j.version=${{ inputs.version }} -PcentralPublish

      # R-B6: an SBOM per published artefact, attached to the release below.
      - name: Generate the SBOMs
        run: ./gradlew cyclonedxBom -Pzengin4j.version=${{ inputs.version }} -PcentralPublish

      - name: Show what would be published
        run: find . -path '*/build/libs/*' -name '*.jar*' | sort

      - name: Publish to Maven Central
        if: ${{ !inputs.dry_run }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          ./gradlew publishAllPublicationsToCentralRepository \
            -Pzengin4j.version=${{ inputs.version }} -PcentralPublish --stacktrace

      - name: Upload the artefacts for inspection
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ inputs.version }}
          path: |
            **/build/libs/*.jar*
            **/build/reports/bom.json
            **/build/reports/bom.xml
          retention-days: 30
