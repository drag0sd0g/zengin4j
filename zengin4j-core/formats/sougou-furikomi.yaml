# 総合振込 (sougou furikomi) — bulk credit transfer, 種別コード 21, 120 bytes.
#
# verified: false — but no longer for want of evidence. See docs/SOURCES.md.
#
# Every field offset and length below is corroborated by six independent
# published sources, including the standard itself: the JBA's own protocol
# document gives all four record types field for field, and five institution
# guides agree with it. The offsets are not in doubt.
#
# What keeps this descriptor unverified is a single field-attribute
# disagreement: sources split on whether 顧客コード1/2 are N or C. R-0.2 is
# explicit that a field on which sources disagree keeps the format
# verified: false until the question is settled, however solid the rest is.
# The disagreement, all six readings and the conservative resolution are
# recorded as D-002 in docs/DISCREPANCIES.md.
#
# Byte offsets do not appear in this file. They are computed from the
# cumulative field lengths when the descriptor is loaded (R-F2), and the loader
# fails if the lengths do not sum to record-length (R-F1).

format:
  id: sougou-furikomi
  name-ja: 総合振込
  name-en: Bulk Credit Transfer
  type-code: "21"
  record-length: 120
  verified: false
  sources:
    - "全国銀行協会 — 「全銀協パーソナル・コンピュータ用標準通信プロトコル（ベーシック手順）適用業務およびレコード・フォーマット」令和元年12月, section 8 総合振込レコード・フォーマット. https://www.zenginkyo.or.jp/fileadmin/res/abstract/efforts/system/jba_protocol_pc.pdf retrieved 2026-08-15. Supports all four record types."
    - "群馬銀行 — 「全銀協制定ファイルフォーマット【総合振込】」. https://www.gunmabank.co.jp/hojin/biznb/service/pdf/z_format1.pdf retrieved 2026-08-15. Supports all four record types."
    - "愛知銀行 — 「総合振込レコード・フォーマット」. https://www.aichibank.co.jp/corporate/efficiently/bizdirect/files/pdf/zengin_format.pdf retrieved 2026-08-15. Supports header and data records."
    - "兵庫県信用組合 — 「全銀協規定フォーマットについて」. https://www.hyogokenshin.co.jp/wp-content/uploads/format1.pdf retrieved 2026-08-15. Supports all four record types."
    - "十八親和銀行 — 「全銀フォーマット」. https://www.18shinwabank.co.jp/pdf/bb_format_zengin.pdf retrieved 2026-08-15. Supports the data record."
    - "三井住友銀行 — 「ファイルレイアウト（総合振込・全銀形式）」. https://www.smbc.co.jp/hojin/eb/web21/pdf/file-layout_01.pdf retrieved 2026-08-15. Supports the data record."
  note: "Offsets and lengths corroborated by six independent sources including the JBA standard. Held at verified: false by D-002 — settled against the standard, which describes 顧客コード1/2 as N(10) each with a C(20) EDI overlay when 識別表示 is Y; this descriptor declares C because the schema cannot express the condition (OQ-8, Epic 7). See docs/DISCREPANCIES.md."

  records:

    header:
      discriminator: "1"
      fields:
        - { seq: 1,  id: dataKubun,        ja: データ区分,   en: Record Type,        type: N, length: 1,  const: "1", codelist: dataKubun }
        - { seq: 2,  id: typeCode,         ja: 種別コード,   en: Business Type,      type: N, length: 2,  const: "21", codelist: typeCode }
        - { seq: 3,  id: codeKubun,        ja: コード区分,   en: Character Code,     type: N, length: 1,  codelist: codeKubun, format: CODE-KUBUN }
        - { seq: 4,  id: originatorCode,   ja: 委託者コード, en: Originator Code,    type: N, length: 10, required: true }
        - { seq: 5,  id: originatorName,   ja: 委託者名,     en: Originator Name,    type: C, length: 40, charclass: PARTY_NAME }
        - { seq: 6,  id: valueDate,        ja: 振込指定日,   en: Value Date,         type: N, length: 4,  format: MMDD }
        - { seq: 7,  id: originBankCode,   ja: 仕向銀行番号, en: Origin Bank Code,   type: N, length: 4,  required: true }
        - { seq: 8,  id: originBankName,   ja: 仕向銀行名,   en: Origin Bank Name,   type: C, length: 15, charclass: BANK_NAME }
        - { seq: 9,  id: originBranchCode, ja: 仕向支店番号, en: Origin Branch Code, type: N, length: 3,  required: true }
        - { seq: 10, id: originBranchName, ja: 仕向支店名,   en: Origin Branch Name, type: C, length: 15, charclass: BANK_NAME }
        - { seq: 11, id: accountType,      ja: 預金種目,     en: Account Type,       type: N, length: 1,  codelist: accountType, codes: "1,2,9" }
        - { seq: 12, id: accountNumber,    ja: 口座番号,     en: Account Number,     type: N, length: 7,  sensitive: true }
        - { seq: 13, id: dummy,            ja: ダミー,       en: Filler,             type: C, length: 17, filler: true }

    data:
      discriminator: "2"
      fields:
        - { seq: 1,  id: dataKubun,             ja: データ区分,       en: Record Type,             type: N, length: 1,  const: "2", codelist: dataKubun }
        - { seq: 2,  id: beneficiaryBankCode,   ja: 被仕向銀行番号,   en: Beneficiary Bank Code,   type: N, length: 4,  required: true }
        - { seq: 3,  id: beneficiaryBankName,   ja: 被仕向銀行名,     en: Beneficiary Bank Name,   type: C, length: 15, charclass: BANK_NAME }
        - { seq: 4,  id: beneficiaryBranchCode, ja: 被仕向支店番号,   en: Beneficiary Branch Code, type: N, length: 3,  required: true }
        - { seq: 5,  id: beneficiaryBranchName, ja: 被仕向支店名,     en: Beneficiary Branch Name, type: C, length: 15, charclass: BANK_NAME }
        - { seq: 6,  id: clearingHouseCode,     ja: 手形交換所番号,   en: Clearing House Code,     type: N, length: 4 }
        - { seq: 7,  id: accountType,           ja: 預金種目,         en: Account Type,            type: N, length: 1,  codelist: accountType, codes: "1,2,4,9" }
        - { seq: 8,  id: accountNumber,         ja: 口座番号,         en: Account Number,          type: N, length: 7,  required: true, sensitive: true }
        - { seq: 9,  id: beneficiaryName,       ja: 受取人名,         en: Beneficiary Name,        type: C, length: 30, charclass: PARTY_NAME, required: true }
        - { seq: 10, id: amount,                ja: 振込金額,         en: Transfer Amount,         type: N, length: 10, required: true, format: AMOUNT }
        - { seq: 11, id: newCode,               ja: 新規コード,       en: New Account Code,        type: N, length: 1,  codelist: newCode }
        # D-002: the JBA standard and three institution guides give these as N;
        # two give them as C, and SMBC documents the attribute as changing with
        # the 識別表示 flag. C is the conservative reading — it accepts digits
        # and letters alike, which matters because when 識別表示 is "Y" these
        # twenty bytes are a single C(20) EDI情報 field in every source. Reading
        # is unaffected either way; the choice governs padding on write and
        # character-set validation. See docs/DISCREPANCIES.md.
        - { seq: 12, id: customerCode1,         ja: 顧客コード1,      en: Customer Code 1,         type: C, length: 10, note: "[D-002] N in the JBA standard, C here; also the first half of EDI情報 C(20) when 識別表示 is Y." }
        - { seq: 13, id: customerCode2,         ja: 顧客コード2,      en: Customer Code 2,         type: C, length: 10, note: "[D-002] N in the JBA standard, C here; also the second half of EDI情報 C(20) when 識別表示 is Y." }
        - { seq: 14, id: transferCategory,      ja: 振込指定区分,     en: Transfer Method,         type: N, length: 1,  codelist: transferCategory }
        - { seq: 15, id: identification,        ja: 識別表示,         en: Identification,          type: C, length: 1, note: "Y means fields 12 and 13 together carry EDI情報 C(20) rather than customer codes; see OQ-8." }
        - { seq: 16, id: dummy,                 ja: ダミー,           en: Filler,                  type: C, length: 7,  filler: true }

    trailer:
      discriminator: "8"
      fields:
        - { seq: 1, id: dataKubun,   ja: データ区分, en: Record Type,   type: N, length: 1,   const: "8", codelist: dataKubun }
        - { seq: 2, id: recordCount, ja: 合計件数,   en: Record Count,  type: N, length: 6,   format: COUNT }
        - { seq: 3, id: totalAmount, ja: 合計金額,   en: Total Amount,  type: N, length: 12,  format: AMOUNT }
        - { seq: 4, id: dummy,       ja: ダミー,     en: Filler,        type: C, length: 101, filler: true }

    end:
      discriminator: "9"
      fields:
        - { seq: 1, id: dataKubun, ja: データ区分, en: Record Type, type: N, length: 1,   const: "9", codelist: dataKubun }
        - { seq: 2, id: dummy,     ja: ダミー,     en: Filler,      type: C, length: 119, filler: true }
