# 検証結果メッセージ（日本語）— R-E4。
#
# 英語版 messages.properties と同じキーを持つこと。キーの過不足は
# MessageBundleTest で検出されます。
#
# 原文の直訳ではなく、日本語として読める指摘文にしています。読み手は多くの場合
# ファイルを作成した本人ではないため、どこを直せばよいかが分かる表現を優先します。
#
# {0}, {1}... は MessageFormat の引数です。

# ---------------------------------------------------------------- engine

V-000.description = ルールの実行に失敗しました
V-000.message = ルール {0} の実行に失敗しました: {1}。これはファイルではなくルール側の不具合です。他のルールはすべて実行されています。

V-100.description = ファイルが読み取れること
V-100.message = ファイルを読み取れませんでした: {0}

# ------------------------------------------------------ tier 1: structural

V-101.description = 各レコードがフォーマット既定のレコード長であること
V-101.message = レコード長が {0} バイトです（{1} は {2} バイト）。レコード長が異なると\
以降の項目がすべてずれるため、このレコードの内容は信頼できません。

V-102.description = 各レコードの先頭バイトが既知のデータ区分であること
V-102.message = データ区分が {0} ですが、{1} では定義されていません。既知の値: {2}。

V-103.description = データレコードがヘッダーレコードより後にあること
V-103.message = ヘッダーレコードより前にデータレコードがあります。各バッチはヘッダーで\
始まり、ヘッダーが振込元口座を示します。

V-104.description = ヘッダー 1 件につきトレーラーが 1 件であること
V-104.message = レコード {0} から始まるバッチにトレーラーが {1} 件あります。各ヘッダーは\
そのバッチの合計を持つトレーラー 1 件で閉じます。

V-105.description = ファイル末尾にエンドレコードがあること
V-105.message = エンドレコード（データ区分 9）がありません。多くの金融機関は終端のない\
ファイルを受け付けません。

V-106.description = エンドレコードの後に何もないこと
V-106.message = エンドレコードの後に {0} 件のレコードがあります。無視されるか、\
ファイル全体がエラーになります。

V-107.description = ファイルにレコードが 1 件以上あること
V-107.message = ファイルにレコードがありません。

# ---------------------------------------------------- tier 2: field syntax

V-201.description = 数字項目が半角数字のみであること
V-201.message = 項目 {0} は数字項目ですが {1} が含まれています。数字項目は半角数字のみ、\
右詰め・前ゼロ埋めです。

V-202.description = 文字項目が使用可能文字のみであること
V-202.message = 項目 {0} に使用できない文字が含まれています: {1}。

V-203.description = 項目の詰め方と埋め文字が属性どおりであること
V-203.message = 項目 {0} の埋め文字が {1} です。{2} 項目は {4}に{3}で埋めます。

V-204.description = 固定値項目が既定の値であること
V-204.message = 項目 {0} は常に {1} である必要がありますが、{2} が設定されています。

V-205.description = コード項目がコード一覧の値であること
V-205.message = 項目 {0} の値 {1} は {2} コード一覧にありません。既知の値: {3}。

V-206.description = 濁点・半濁点が付与可能なカナに続いていること
V-206.message = 項目 {0} で {2} の後に{1}が付いていますが、この文字には付きません。\
濁点は ｶ-ｺ、ｻ-ｿ、ﾀ-ﾄ、ﾊ-ﾎ、ｳ のみ、半濁点は ﾊ-ﾎ のみです。

# ----------------------------------------------------- tier 3: consistency

V-301.description = トレーラーの合計金額が明細の合計と一致すること
V-301.message = トレーラーの合計金額は {0} ですが、明細の合計は {1} です（差額 {2}）。

V-302.description = トレーラーの件数が明細件数と一致すること
V-302.message = トレーラーの合計件数は {0} ですが、データレコードは {1} 件です。

V-303.description = 明細金額の合計が桁あふれしないこと
V-303.message = このバッチの合計金額が 64 ビット整数を超えます。ファイルが破損しているか、\
想定した形式ではありません。

V-304.description = 合計金額がトレーラー項目に収まること
V-304.message = 合計金額 {0} はトレーラーの {1} 桁項目に収まりません（最大 {2}）。\
バッチを分割してください。

V-305.description = すべてのヘッダーが同じ種別コードであること
V-305.message = ヘッダーの種別コードが {0} ですが、同一ファイル内の先行ヘッダーは {1} です。\
1 ファイルにつき 1 業務です。

V-306.description = 同一バッチ内に同一内容の明細がないこと
V-306.message = レコード {0} の明細と、銀行・支店・口座・金額がすべて同一です。\
仕様上は可能ですが、多くは行の重複です。

# -------------------------------------------------- tier 4: reference data

V-401.description = 金融機関コードが存在すること
V-401.message = 金融機関コード {0} は参照データにありません。

V-402.description = 支店が当該金融機関に存在すること
V-402.message = 支店コード {0} は金融機関 {1} の参照データにありません。

V-403.description = 名称が参照データと一致すること
V-403.message = 項目 {0} は {1} ですが、参照データでは {2} です。

# -------------------------------------------------------- tier 5: calendar

V-501.description = 振込指定日が土日でないこと
# {1} is the English weekday name and is deliberately unused here: the date
# in {0} already says which day it is, and an English word in a Japanese
# sentence reads as a bug even when the meaning survives.
V-501.message = 振込指定日 {0} は土日にあたります。土日は資金が動きません。

V-502.description = 振込指定日が祝日でないこと
V-502.message = 振込指定日 {0} は祝日（{1}）です。

V-503.description = 振込指定日が年末年始休業期間でないこと
V-503.message = 振込指定日 {0} は金融機関の年末年始休業期間にあたります。

V-504.description = 振込指定日が受付可能期間内であること
V-504.message = 振込指定日 {0} は {2} から {1} 日先です。先日付の受付は通常 {3} 日程度までです。

V-505.description = 振込指定日がカレンダーの有効期限内であること
V-505.message = 振込指定日 {0} はこのカレンダーの有効期限 {1} を超えており、営業日かどうか\
判断できません。日本の祝日は事前に公告されるもので計算で求まるものではないため、\
推測せずに報告しています。

# ------------------------------------------------- tier 6: semantic warning

V-601.description = 名称が濁点の途中で切れていないこと
V-601.message = 項目 {0} の末尾が、濁点が切り落とされたと思われるカナで終わっています。\
カナと濁点の間で切ると別の文字になります。

V-602.description = 金額 0 円の明細がないこと
V-602.message = 振込金額が 0 円です。多くの金融機関はファイルを返却せず、当該明細を\
送信対象から除外します。

V-603.description = 金額が項目の最大値でないこと
V-603.message = 振込金額が {0} で、項目に格納できる最大値です。実際にこの金額の場合も\
ありますが、桁あふれや切り詰めでも同じ値になります。

V-604.description = 名称項目が空白でないこと
V-604.message = 項目 {0} がすべて空白です。受取金融機関はこの名称で照合します。

V-605.description = 顧客コード項目が設定されていること
V-605.message = 顧客コード 1・2 がいずれも未設定です。任意項目ですが、返却ファイルと\
送信内容を突き合わせる際に必要になります。
