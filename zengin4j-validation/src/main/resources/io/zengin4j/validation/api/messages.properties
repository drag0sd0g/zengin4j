# Validation findings, English (R-E4).
#
# Every rule has a .message and a .description. The message is what a reader
# sees against their file; the description says what the rule checks and appears
# where a report lists the rules themselves, as SARIF does.
#
# Keep messages specific. "Invalid record" tells nobody anything; "record is 118
# bytes, expected 120" tells them where to look. Where there is an obvious fix,
# say it — the reader is usually not the person who wrote the file.
#
# {0}, {1}... are MessageFormat arguments, and a literal apostrophe in a
# *.message must be doubled because MessageFormat treats a single one as a
# quoting character. A *.description is returned verbatim and must NOT double
# its apostrophes — MessageBundleTest checks both ways round, because getting it
# backwards is invisible until somebody reads a report.

# ---------------------------------------------------------------- engine

V-000.description = A rule failed to run
V-000.message = rule {0} failed to run: {1}. This is a defect in the rule, not in the file; every other rule still ran.

V-100.description = The file can be read at all
V-100.message = The file could not be read: {0}

# ------------------------------------------------------ tier 1: structural

V-101.description = Every record is exactly the format's record length
V-101.message = Record is {0} bytes, but {1} declares {2}-byte records. A short or long \
record shifts every field after it, so nothing in this record can be trusted.

V-102.description = The first byte of every record is a known データ区分
V-102.message = データ区分 is {0}, which {1} does not define. Known values: {2}.

V-103.description = Data records follow a header
V-103.message = A data record appears before any header record. Every batch begins with a \
header, which names the account the payments come from.

V-104.description = Each header has exactly one trailer
V-104.message = The batch beginning at record {0} has {1} trailer records. Each header is \
closed by exactly one trailer carrying that batch''s totals.

V-105.description = The file ends with an end record
V-105.message = The file has no end record (データ区分 9). Most institutions reject a file \
that does not declare its own end.

V-106.description = Nothing follows the end record
V-106.message = {0} record(s) follow the end record. Anything after it will be ignored at \
best and will fail the file at worst.

V-107.description = The file contains at least one record
V-107.message = The file contains no records.

# ---------------------------------------------------- tier 2: field syntax

V-201.description = Numeric fields contain only ASCII digits
V-201.message = Field {0} is numeric but contains {1}. Numeric fields hold ASCII digits \
only, right-aligned and padded with zeros.

V-202.description = Text fields contain only permitted characters
V-202.message = Field {0} contains a character it may not: {1}.

V-203.description = Fields are aligned and padded as their type requires
V-203.message = Field {0} is padded with {1}. A {2} field pads with {3}, on the {4}.

V-204.description = Constant fields hold their declared value
V-204.message = Field {0} must always contain {1}, but contains {2}.

V-205.description = Coded fields hold a value from their code list
V-205.message = Field {0} contains {1}, which is not in the {2} code list. Known values: {3}.

V-206.description = A voicing mark follows a kana that can take one
V-206.message = Field {0} has a {1} after {2}, which cannot take one. Only ｶ-ｺ, ｻ-ｿ, ﾀ-ﾄ, \
ﾊ-ﾎ and ｳ take a dakuten; only ﾊ-ﾎ take a handakuten.

# ----------------------------------------------------- tier 3: consistency

V-301.description = The trailer total equals the sum of its batch
V-301.message = Trailer total is {0} but the batch''s payments add up to {1}, a difference \
of {2}.

V-302.description = The trailer count equals the number of records in its batch
V-302.message = Trailer count is {0} but the batch contains {1} data record(s).

V-303.description = Batch amounts do not overflow
V-303.message = The payments in this batch overflow a 64-bit total. The file is either \
corrupt or is not what it claims to be.

V-304.description = The batch total fits the trailer field
V-304.message = The batch totals {0}, which does not fit the trailer''s {1}-digit field \
(maximum {2}). Split the batch.

V-305.description = Every header declares the same 種別コード
V-305.message = Header declares 種別コード {0}, but an earlier header in this file declared \
{1}. One file carries one business type.

V-306.description = No two payments in a batch are identical
V-306.message = This payment is identical to the one in record {0}: same bank, branch, \
account and amount. That is legal, and is usually a duplicated row.

# -------------------------------------------------- tier 4: reference data

V-401.description = The bank code exists
V-401.message = Bank code {0} is not in the reference data.

V-402.description = The branch exists within its bank
V-402.message = Branch {0} is not in the reference data for bank {1}.

V-403.description = The name matches the reference data
V-403.message = Field {0} is {1}, but the reference data gives {2} for this institution.

# -------------------------------------------------------- tier 5: calendar

V-501.description = The value date is not a weekend
V-501.message = Value date {0} is a {1}. Funds do not move on weekends.

V-502.description = The value date is not a public holiday
V-502.message = Value date {0} is {1}, a public holiday.

V-503.description = The value date is not in the year-end closure
V-503.message = Value date {0} falls in the year-end closure, when financial institutions \
do not process transfers.

V-504.description = The value date is within the accepted forward window
V-504.message = Value date {0} is {1} day(s) ahead of {2}. Institutions typically accept \
instructions up to {3} days in advance.

V-505.description = The value date is within the calendar's horizon
V-505.message = Value date {0} is beyond this calendar''s horizon of {1}, so whether it is \
a business day is unknown. Japanese public holidays are announced in advance and not \
computed; a calendar that guessed past its data would be worse than one that says so.

# ------------------------------------------------- tier 6: semantic warning

V-601.description = A name is not truncated through a voicing mark
V-601.message = Field {0} ends in a kana whose voicing mark appears to have been cut off. \
Truncating between a kana and its mark changes the character.

V-602.description = No payment is for zero
V-602.message = Payment amount is zero. Most institutions drop a zero-amount record rather \
than reject the file, so this will usually be silently ignored.

V-603.description = No amount sits at the field maximum
V-603.message = Payment amount is {0}, the largest value the field can hold. A real amount \
this size is possible; a truncated or overflowed one looks exactly like this.

V-604.description = Name fields are populated
V-604.message = Field {0} is entirely blank. The receiving institution matches on this name.

V-605.description = Customer reference fields are populated
V-605.message = Both customer code fields are empty. They are optional, and are what lets \
you reconcile a returned file against what you sent.
