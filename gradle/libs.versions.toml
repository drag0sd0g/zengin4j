# Version catalogue (R-B1).
#
# NOTE: nothing here is a runtime dependency of zengin4j-core (R-M1, P3).
# Every entry below is test-scoped or build-scoped. The ArchUnit rule
# `coreHasNoThirdPartyRuntimeDependencies` enforces that at the bytecode level.
[versions]
junit = "5.14.4"
assertj = "3.27.7"
archunit = "1.5.0"
# Coverage-guided fuzzing (R-T9). Test-scoped, and run by its own task rather
# than by `check`: fuzzing is a nightly job, not a per-commit one.
jazzer = "0.30.0"
jacoco = "0.8.15"
pitest = "1.25.9"
pitest-junit5 = "1.2.3"
# Build-scoped only: used by zengin4j-codegen to read the descriptors and
# generate them into core. It never reaches a published runtime class path.
snakeyaml = "2.6"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jazzer-junit = { module = "com.code-intelligence:jazzer-junit", version.ref = "jazzer" }
# Driven through its command line entry point rather than the Gradle plugin:
# info.solidsoft.pitest 1.15.0 is the newest release and does not run on
# Gradle 9 (it reads reporting.baseDir, which was removed).
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
pitest-command-line = { module = "org.pitest:pitest-command-line", version.ref = "pitest" }
pitest-junit5-plugin = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitest-junit5" }
