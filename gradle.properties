org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# The build compiles with --release 21 (R-M7) using whichever JDK >= 21 runs
# Gradle, rather than pinning a toolchain. Rationale: it keeps a fresh clone
# buildable without downloading a second JDK, and the CI matrix (JDK 21 and 25,
# R-B2) is what actually proves both runtimes. See docs/adr/0002.
